<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>神修尼亚</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="神修尼亚">
<meta name="theme-color" content="#12b7f5">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f1f2f4;height:100vh;overflow:hidden;color:#111}
img{max-width:100%}
html,body{overscroll-behavior:none}
@supports(padding-top:env(safe-area-inset-top)){
  .topbar{padding-top:calc(10px + env(safe-area-inset-top))}
  .inputbar{padding-bottom:calc(9px + env(safe-area-inset-bottom))}
  .tabbar{padding-bottom:calc(3px + env(safe-area-inset-bottom))}
}

/* ===== 遮罩/授权/登录 ===== */
.mask{position:fixed;inset:0;background:rgba(15,20,30,.55);display:flex;align-items:center;justify-content:center;z-index:300;padding:18px}
.card{background:#fff;border-radius:16px;width:100%;max-width:400px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.card h2{font-size:18px;margin-bottom:4px;color:#0d2136}
.card .desc{font-size:12px;color:#8a94a6;margin-bottom:16px;line-height:1.6}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:#5b6577;margin-bottom:6px;font-weight:600}
.field input{width:100%;padding:11px 13px;border:1.5px solid #e3e8f0;border-radius:10px;font-size:14px;outline:none;background:#f8fafc}
.field input:focus{border-color:#0099ff;background:#fff}
.btn{border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;width:100%}
.btn.main{background:linear-gradient(135deg,#12b7f5,#0487d8);color:#fff}
.btn.ghost{background:#f1f4f9;color:#5b6577;margin-top:8px}
.btn:disabled{opacity:.6}
.tip{font-size:12px;margin-top:12px;color:#8a94a6;line-height:1.7}
.tip.err{color:#e5484d}
.devbox{background:#f5f8fc;border:1px dashed #c3d3e5;border-radius:10px;padding:12px;font-size:13px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.devbox code{font-weight:700;color:#0487d8;font-size:13px}
.copybtn{background:#e8f4fd;color:#0487d8;border:none;border-radius:7px;padding:6px 11px;font-size:12px;cursor:pointer;font-weight:600}
.brand{text-align:center;margin-bottom:14px}
.brand img{width:76px;height:76px;border-radius:14px;object-fit:cover;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.brand .bn{font-size:21px;font-weight:800;color:#0d2136;margin-top:9px}
.brand .bs{font-size:10px;color:#9aa3b3;letter-spacing:6px;margin-top:3px}

/* ===== 主界面 ===== */
.app{display:flex;height:100vh;background:#fff;position:relative}
.main{width:100%;display:flex;flex-direction:column;background:#f1f2f4;min-width:0}
.topbar{background:#fff;padding:10px 12px;display:flex;align-items:center;gap:9px;flex-shrink:0}
.search{flex:1;background:#f1f2f4;border-radius:18px;padding:8px 13px;font-size:13px;color:#333;border:none;outline:none}
.plus{width:32px;height:32px;border-radius:9px;background:#f1f2f4;border:none;font-size:19px;color:#555;cursor:pointer}
.pages{flex:1;overflow-y:auto}
.page{display:none}
.page.on{display:block}

/* 会话行 */
.conv{display:flex;align-items:center;gap:11px;padding:11px 14px;background:#fff;border-bottom:1px solid #f5f6f8;cursor:pointer}
.conv:active{background:#f7f8fa}
.av{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#12b7f5,#0487d8);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.cc{flex:1;min-width:0}
.cname{font-size:15px;font-weight:600;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clast{font-size:12.5px;color:#9aa0aa;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr{text-align:right;flex-shrink:0}
.ctime{font-size:11px;color:#b3b8c0}
.badge{display:inline-block;margin-top:5px;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:#f74d4d;color:#fff;font-size:11px;text-align:center;padding:0 5px}

/* 联系人分组标题 */
.group-title{padding:10px 16px 6px;font-size:12px;color:#9aa0aa;background:#f1f2f4}

/* 我的页 */
.me-page{background:#fff;padding:0 0 20px}
.me-head{background:linear-gradient(135deg,#12b7f5,#0487d8);padding:34px 20px 26px;display:flex;align-items:center;gap:14px;color:#fff}
.me-head .av{width:60px;height:60px;border-radius:16px;background:rgba(255,255,255,.25)}
.me-head .nm{font-size:19px;font-weight:800}
.me-head .uid{font-size:12px;opacity:.85;margin-top:4px}
.me-rows{margin-top:10px;background:#fff}
.mrow{display:flex;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #f5f6f8;font-size:14px}
.mrow span:first-child{color:#333}
.mrow span:last-child{color:#9aa0aa;font-size:13px;max-width:60%;text-align:right;word-break:break-all}
.logout{margin:20px 18px 0;background:#fff;border:none;color:#e5484d;font-size:15px;padding:14px;width:calc(100% - 36px);border-radius:10px;cursor:pointer;font-weight:600}

/* ===== 底部 TAB ===== */
.tabbar{display:flex;background:#f7f8fa;border-top:1px solid #e6e8ec;padding:5px 0 3px;flex-shrink:0}
.tab{flex:1;text-align:center;color:#8a8f99;font-size:11px;cursor:pointer;padding:2px 0}
.tab.on{color:#0099ff}
.tab .ic{display:block;font-size:19px;line-height:1.35;filter:grayscale(1) opacity(.6)}
.tab.on .ic{filter:none}

/* ===== 聊天页 ===== */
.chat{position:absolute;inset:0;background:#f1f2f4;display:none;flex-direction:column;z-index:60}
.chat.open{display:flex}
.chead{background:#fff;padding:11px 13px;display:flex;align-items:center;gap:9px;border-bottom:1px solid #eceef1;flex-shrink:0}
.backbtn{width:30px;height:30px;border:none;background:none;font-size:22px;color:#333;cursor:pointer;line-height:1}
.chead .av{width:34px;height:34px;border-radius:9px;font-size:14px}
.chead .tt{font-size:15px;font-weight:700;color:#111}
.chead .st{font-size:11px;color:#9aa0aa;margin-top:2px}
.msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:8px;max-width:80%}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.msg .av{width:34px;height:34px;border-radius:9px;font-size:13px}
.msg .bd{min-width:0}
.msg .sn{font-size:11px;color:#9aa0aa;margin-bottom:3px}
.msg.mine .sn{text-align:right}
.bubble{padding:9px 13px;border-radius:12px;font-size:14px;line-height:1.55;word-break:break-word;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.msg.mine .bubble{background:#12b7f5;color:#fff}
.bubble img{max-width:200px;border-radius:8px;display:block;cursor:pointer}
.bubble video{max-width:220px;border-radius:8px;display:block}
.rep{font-size:10px;color:#c6ccd6;margin-top:3px;opacity:0;cursor:pointer}
.msg:hover .rep{opacity:1}
.sys-line{align-self:center;font-size:11px;color:#a2a8b2;background:#e6e8ec;padding:4px 12px;border-radius:10px}
.inputbar{background:#fff;border-top:1px solid #eceef1;padding:8px 10px;display:flex;align-items:flex-end;gap:7px;flex-shrink:0}
.ib{width:34px;height:34px;border-radius:9px;border:none;background:#f3f5f8;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.minput{flex:1;border:1.5px solid #e6e8ec;border-radius:10px;padding:8px 11px;font-size:14px;resize:none;max-height:100px;outline:none;font-family:inherit;line-height:1.4}
.minput:focus{border-color:#12b7f5}
.sendb{background:#12b7f5;color:#fff;border:none;border-radius:10px;padding:0 16px;height:36px;font-size:14px;font-weight:700;cursor:pointer;flex-shrink:0}
.typing{font-size:11px;color:#9aa0aa;padding:0 14px 4px;min-height:0}

/* 举报弹窗 */
.reasons{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.reason{padding:7px 12px;border:1.5px solid #e3e8f0;border-radius:9px;font-size:13px;cursor:pointer;background:#f8fafc;color:#5b6577}
.reason.on{border-color:#12b7f5;background:#e8f4fd;color:#0487d8;font-weight:600}
textarea{width:100%;padding:10px 12px;border:1.5px solid #e3e8f0;border-radius:10px;font-size:13px;resize:none;height:72px;outline:none;font-family:inherit;background:#f8fafc;margin-bottom:12px}

/* 桌面并排 */
@media(min-width:761px){
  .app{max-width:1100px;margin:0 auto;box-shadow:0 0 30px rgba(0,0,0,.08)}
  .main{width:330px;flex-shrink:0;border-right:1px solid #e6e8ec}
  .chat{position:relative;inset:auto;display:flex;flex:1;z-index:1}
  .backbtn{display:none}
  .tabbar{display:flex}
}
@media(max-width:760px){
  .tabbar{display:flex}
}
</style>
</head>
<body>

<!-- 账号登录 -->
<div class="mask" id="loginMask" style="display:none">
  <div class="card">
    <div class="brand">
      <img src="logo.png" alt="标志">
      <div class="bn">神修尼亚</div>
      <div class="bs">神修帝国</div>
    </div>
    <div class="desc" id="loginDesc">登录你的账号，或注册一个新账号</div>
    <div class="field" id="uidField"><label>名字 / 社区ID</label><input id="loginUid" maxlength="20" placeholder="输入你的名字或12位ID"></div>
    <div class="field" id="nickField" style="display:none"><label>名字</label><input id="loginNick" maxlength="20" placeholder="给自己起个名字（不能重复）"></div>
    <div class="field"><label>密码</label><input id="loginPwd" type="password" maxlength="32" placeholder="至少4位"></div>
    <div class="field" id="pwd2Field" style="display:none"><label>确认密码</label><input id="loginPwd2" type="password" maxlength="32" placeholder="再输入一次密码"></div>
    <button class="btn main" id="loginBtn" onclick="doAccount()">进入</button>
    <button class="btn ghost" onclick="toggleMode()" id="modeBtn">没有账号？去注册</button>
    <div class="tip" id="loginTip"></div>
  </div>
</div>

<!-- 举报 -->
<div class="mask" id="reportMask" style="display:none">
  <div class="card">
    <h2>举报该用户</h2>
    <div class="desc" id="reportTarget">举报内容直接提交到管理员后台</div>
    <div class="reasons" id="reasonList"></div>
    <textarea id="reportText" placeholder="补充说明（选填）"></textarea>
    <button class="btn main" onclick="doReport()">提交举报</button>
    <button class="btn ghost" onclick="closeReport()">取消</button>
  </div>
</div>

<!-- 主界面 -->
<div class="app" id="app" style="display:none">
  <div class="main">
    <div class="topbar">
      <input class="search" id="searchBox" placeholder="搜索" oninput="filterList()">
      <button class="plus" onclick="openAddFriend()">+</button>
    </div>
    <div class="pages">
      <div class="page on" id="pageMsgs"><div id="msgList"></div></div>
      <div class="page" id="pageContacts"><div id="contactList"></div></div>
      <div class="page" id="pageMe">
        <div class="me-page">
          <div class="me-head">
            <div class="av" id="meAvatar">?</div>
            <div><div class="nm" id="meName">-</div><div class="uid" id="meUid">-</div></div>
          </div>
          <div class="me-rows">
            <div class="mrow"><span>设备号</span><span id="meDev">-</span></div>
            <div class="mrow"><span>服务器</span><span id="meSrv">-</span></div>
            <div class="mrow"><span>版本</span><span>神修尼亚 1.0.0</span></div>
          </div>
          <button class="logout" onclick="logout()">退出登录</button>
        </div>
      </div>
    </div>
    <div class="tabbar">
      <div class="tab on" data-tab="msgs" onclick="switchTab('msgs')"><span class="ic">💬</span>消息</div>
      <div class="tab" data-tab="contacts" onclick="switchTab('contacts')"><span class="ic">👥</span>联系人</div>
      <div class="tab" data-tab="me" onclick="switchTab('me')"><span class="ic">👤</span>我的</div>
    </div>
  </div>

  <div class="chat" id="chat">
    <div class="chead">
      <button class="backbtn" onclick="backToList()">‹</button>
      <div class="av" id="chatAvatar">群</div>
      <div><div class="tt" id="chatTitle">神修尼亚官方群</div><div class="st" id="chatSub">公开群聊</div></div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="typing" id="typing"></div>
    <div class="inputbar">
      <button class="ib" onclick="pickImage()">🖼</button>
      <textarea class="minput" id="msgInput" rows="1" placeholder="输入消息…" onkeydown="onInputKey(event)"></textarea>
      <button class="sendb" onclick="sendText()">发送</button>
    </div>
  </div>
</div>

<script>
/* ===== 基础 ===== */
const $=id=>document.getElementById(id);
const LS_DEV='sx_device_id', LS_UID='sx_uid', LS_TOKEN='sx_token', LS_BASE='sx_base';
const SERVER_DEFAULT='http://192.168.0.100:3000';
let BASE=(localStorage.getItem(LS_BASE)|| (location.protocol==='file:'?SERVER_DEFAULT:'')).replace(/\/+$/,'');
function apiUrl(p){return BASE+p}
function post(path,body){return fetch(apiUrl(path),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json()).catch(()=>({ok:false,msg:'网络错误，请检查服务器地址'}))}
function get(path){return fetch(apiUrl(path)).then(r=>r.json()).catch(()=>({ok:false,msg:'网络错误，请检查服务器地址'}))}
function getDeviceId(){
  if(window.__ANDROID_ID__) return String(window.__ANDROID_ID__).trim();
  let id=localStorage.getItem(LS_DEV);
  if(!id){const r=()=>Math.random().toString(36).slice(2,8).toUpperCase();id='XG-'+r()+'-'+r();localStorage.setItem(LS_DEV,id);}
  return id;
}
const DEVICE_ID=getDeviceId();
if($('devShow')) $('devShow').textContent=DEVICE_ID;
$('meDev').textContent=DEVICE_ID;
$('meSrv').textContent=BASE||'本机';
function copyDev(){navigator.clipboard?navigator.clipboard.writeText(DEVICE_ID).then(()=>alert('设备号已复制')):(function(){const t=document.createElement('input');t.value=DEVICE_ID;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('设备号已复制')})();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fc(s){return (s||'?').trim().charAt(0).toUpperCase()}

/* ===== 直接进入登录注册页；仅对被封禁设备静默拦截 ===== */
async function checkAuth(){
  if(BASE || location.protocol!=='file:'){
    try{
      const r=await post('/api/auth-check',{deviceId:DEVICE_ID});
      if(r && r.status==='banned'){ showDeviceBanned(); return; }
    }catch(e){}
  }
  showLogin();
}
function showDeviceBanned(){
  if(document.getElementById('devBanMask')) return;
  const d=document.createElement('div');
  d.id='devBanMask';
  d.style.cssText='position:fixed;inset:0;z-index:9999;background:#0a0c11;display:flex;align-items:center;justify-content:center;padding:24px';
  d.innerHTML='<div style="max-width:420px;background:#12141a;border:1px solid #2a2f3d;border-radius:16px;padding:28px 24px;text-align:center;color:#e6e9f0">'+
    '<div style="font-size:20px;font-weight:700;margin-bottom:12px">该设备已被禁用</div>'+
    '<div style="color:#8891a5;font-size:14px;line-height:1.9">此设备已被管理员锁定，无法使用神修尼亚。<br>请把你的设备号发给管理员解封。</div>'+
    '<div style="margin-top:16px;padding:10px;background:#171a22;border-radius:10px;font-family:monospace;color:#f6c453;font-size:13px;word-break:break-all">'+esc(DEVICE_ID)+'</div>'+
    '<button style="margin-top:18px;width:100%;padding:12px;border:none;border-radius:10px;background:#f6c453;color:#111;font-weight:700;font-size:15px;cursor:pointer" onclick="copyDev()">复制设备号</button>'+
  '</div>';
  document.body.appendChild(d);
}
function setServer(){
  const cur=BASE||'http://';
  const v=prompt('服务器地址，例如 http://192.168.0.100:3000',cur);
  if(v===null) return;
  const t=v.trim().replace(/\/+$/,'');
  localStorage.setItem(LS_BASE,t); location.reload();
}

/* ===== 账号 ===== */
let regMode=false, me=null, ws=null;
function showLogin(){
  const am=$('authMask'); if(am) am.style.display='none';
  $('loginMask').style.display='flex';
  const uid=localStorage.getItem(LS_UID), token=localStorage.getItem(LS_TOKEN);
  if(uid&&token){ post('/api/autologin',{uid,token,deviceId:DEVICE_ID}).then(r=>{ if(r.ok) enterApp(r.user); else localStorage.removeItem(LS_TOKEN); }); }
}
function toggleMode(){
  regMode=!regMode;
  $('uidField').style.display=regMode?'none':'block';
  $('nickField').style.display=regMode?'block':'none';
  $('pwd2Field').style.display=regMode?'block':'none';
  $('loginBtn').textContent=regMode?'注册并进入':'进入';
  $('modeBtn').textContent=regMode?'已有账号？去登录':'没有账号？去注册';
  $('loginDesc').textContent=regMode?'注册只需「名字 + 密码」':'登录：输入名字或社区ID + 密码';
  $('loginTip').textContent='';
}
async function doAccount(){
  const tip=$('loginTip'); let r;
  if(regMode){
    const nick=$('loginNick').value.trim(), pwd=$('loginPwd').value, pwd2=$('loginPwd2').value;
    if(!nick){tip.className='tip err';tip.textContent='请输入名字';return}
    if(pwd.length<4){tip.className='tip err';tip.textContent='密码至少4位';return}
    if(pwd!==pwd2){tip.className='tip err';tip.textContent='两次输入的密码不一致';return}
    $('loginBtn').disabled=true;
    r=await post('/api/register',{nick:nick,password:pwd,deviceId:DEVICE_ID});
    if(r.ok) r=await post('/api/login',{account:nick,password:pwd,deviceId:DEVICE_ID});
  } else {
    const acc=$('loginUid').value.trim(), pwd=$('loginPwd').value;
    if(!acc){tip.className='tip err';tip.textContent='请输入名字或ID';return}
    if(pwd.length<4){tip.className='tip err';tip.textContent='密码至少4位';return}
    $('loginBtn').disabled=true;
    r=await post('/api/login',{account:acc,password:pwd,deviceId:DEVICE_ID});
  }
  $('loginBtn').disabled=false;
  if(!r.ok){tip.className='tip err';tip.textContent=r.msg||'操作失败';return}
  localStorage.setItem(LS_UID,r.user.uid); localStorage.setItem(LS_TOKEN,r.user.token||'');
  enterApp(r.user);
}

/* ===== 主界面 ===== */
let current={type:'group',id:'default',name:'神修尼亚官方群'};
let friends=[], curTab='msgs';
function enterApp(u){
  me=u; $('loginMask').style.display='none'; $('app').style.display='flex';
  $('meName').textContent=me.nick||'-'; $('meUid').textContent='ID：'+me.uid;
  setAv($('meAvatar'),me.nick,me.avatar);
  connectWS(); loadFriends();
  if(window.innerWidth>=761){ openConv(current,true); }
  if(u.watchDays>0){
    setTimeout(()=>alert('注意：你目前处于 '+u.watchDays+' 天观察期。\n原因：'+(u.watchReason||'被多人举报')+'\n观察期内再被多人举报，账号将被封禁。'),700);
  }
}
function setAv(el,nick,avatar){
  if(avatar){el.innerHTML='<img src="'+esc(avatar)+'">';} else {el.textContent=fc(nick);}
}
function switchTab(t){
  curTab=t;
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('on',el.dataset.tab===t));
  ['msgs','contacts','me'].forEach(k=>{
    const p=$('page'+(k==='msgs'?'Msgs':k==='contacts'?'Contacts':'Me'));
    p.classList.toggle('on',k===t);
  });
  if(window.innerWidth<761) closeChat();
}
function backToList(){ if(window.innerWidth<761) closeChat(); }
function closeChat(){ $('chat').classList.remove('open'); }

/* 会话列表 */
function renderMsgList(){
  const box=$('msgList'); box.innerHTML='';
  const items=[{type:'group',id:'default',name:'神修尼亚官方群',last:'官方社区群聊',avatar:''}]
    .concat(friends.map(f=>({type:'dm',id:f.uid,name:f.nick,last:'点击开始聊天',avatar:f.avatar})));
  items.forEach(c=>{
    const d=document.createElement('div'); d.className='conv';
    const av=document.createElement('div'); av.className='av'; setAv(av,c.name,c.avatar);
    const cc=document.createElement('div'); cc.className='cc';
    cc.innerHTML='<div class="cname">'+esc(c.name)+'</div><div class="clast">'+esc(c.last)+'</div>';
    const cr=document.createElement('div'); cr.className='cr';
    cr.innerHTML='<div class="ctime">'+nowHM()+'</div>';
    d.appendChild(av);d.appendChild(cc);d.appendChild(cr);
    d.onclick=()=>openConv(c);
    box.appendChild(d);
  });
}
function nowHM(){const d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function renderContacts(){
  const box=$('contactList'); box.innerHTML='';
  const t1=document.createElement('div'); t1.className='group-title'; t1.textContent='群聊';
  box.appendChild(t1);
  const g=document.createElement('div'); g.className='conv';
  const gav=document.createElement('div'); gav.className='av'; gav.textContent='群';
  const gcc=document.createElement('div'); gcc.className='cc'; gcc.innerHTML='<div class="cname">神修尼亚官方群</div><div class="clast">公开群聊</div>';
  g.appendChild(gav);g.appendChild(gcc); g.onclick=()=>openConv({type:'group',id:'default',name:'神修尼亚官方群'});
  box.appendChild(g);
  const t2=document.createElement('div'); t2.className='group-title'; t2.textContent='好友（'+friends.length+'）';
  box.appendChild(t2);
  if(!friends.length){
    const e=document.createElement('div'); e.style.padding='24px'; e.style.textAlign='center'; e.style.color='#a8aeb8'; e.style.fontSize='13px'; e.textContent='还没有好友，点右上角 + 添加';
    box.appendChild(e);
  }
  friends.forEach(f=>{
    const d=document.createElement('div'); d.className='conv';
    const av=document.createElement('div'); av.className='av'; setAv(av,f.nick,f.avatar);
    const cc=document.createElement('div'); cc.className='cc';
    cc.innerHTML='<div class="cname">'+esc(f.nick)+'</div><div class="clast">ID '+esc(f.uid)+'</div>';
    d.appendChild(av);d.appendChild(cc); d.onclick=()=>openConv({type:'dm',id:f.uid,name:f.nick,avatar:f.avatar});
    box.appendChild(d);
  });
}
function filterList(){
  const q=$('searchBox').value.trim().toLowerCase();
  const box = curTab==='contacts' ? $('contactList') : $('msgList');
  box.querySelectorAll('.conv').forEach(el=>{
    el.style.display=(el.textContent||'').toLowerCase().includes(q)?'flex':'none';
  });
}
async function loadFriends(){
  const r=await get('/api/users');
  if(!r.ok) return;
  friends=(r.list||[]).filter(u=>u.uid!==me.uid);
  renderMsgList(); renderContacts();
}

/* 打开会话 */
function openConv(c,quiet){
  current=c;
  $('chatTitle').textContent=c.name;
  $('chatSub').textContent=c.type==='group'?'公开群聊':'私聊';
  setAv($('chatAvatar'),c.name,c.avatar);
  $('msgs').innerHTML='';
  if(window.innerWidth<761) $('chat').classList.add('open');
  else $('chat').classList.add('open');
  if(c.type==='group') requestGroupHistory(); else loadDM(c.id);
}

/* ===== WebSocket ===== */
function connectWS(){
  let url; if(BASE){const u=new URL(BASE);url=(u.protocol==='https:'?'wss':'ws')+'://'+u.host+'/ws';}
  else url=(location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws';
  ws=new WebSocket(url);
  ws.onopen=()=>{ ws.send(JSON.stringify({type:'auth',uid:me.uid,nick:me.nick})); };
  ws.onmessage=e=>{ let m;try{m=JSON.parse(e.data)}catch(_){return} handleWS(m); };
  ws.onclose=()=>{ setTimeout(()=>{if(me)connectWS()},2000); };
  ws.onerror=()=>{};
}
function handleWS(m){
  if(m.type==='history'){ if(current.type==='group'){ $('msgs').innerHTML=''; (m.data||[]).forEach(x=>renderMsg(x,true)); toBottom(); } }
  else if(m.type==='chat'){ if(current.type==='group'&&(m.data.gid==='default'||!m.data.gid)){ renderMsg(m.data); toBottom(); } }
  else if(m.type==='dm'){ if(current.type==='dm'){ const d=m.data; if((d.from===me.uid&&d.to===current.id)||(d.from===current.id&&d.to===me.uid)){ renderMsg(Object.assign({},d,{senderId:d.from,sender:d.fromNick,avatar:d.fromAvatar}),false,true); toBottom(); } } }
  else if(m.type==='system'){ if(current.type==='group'){ addSys((m.data&&m.data.content)||m.data); } }
  else if(m.type==='delete'){ const el=document.querySelector('[data-mid="'+m.data.id+'"]'); if(el)el.remove(); }
  else if(m.type==='kicked'){ alert('你已被移出群聊'); }
  else if(m.type==='error'){ const d=m.data||{}; alert(d.msg||'操作失败'); if(d.full){ setTimeout(()=>location.reload(),900); } }
  else if(m.type==='violation'){ alert((m.data&&m.data.msg)||'消息含违规内容，已被拦截'); }
  else if(m.type==='banned'){
    const until=(m.data&&m.data.until)||0, left=Math.max(1,Math.ceil((until-Date.now())/3600000));
    const reason=(m.data&&m.data.reason)||'违反社区规定';
    localStorage.removeItem(LS_TOKEN); localStorage.removeItem(LS_UID);
    alert('你的账号已被封禁\n原因：'+reason+'\n剩余约 '+left+' 小时，到期自动解封');
    setTimeout(()=>location.reload(),900);
  }
}
function requestGroupHistory(){ if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:'join',data:{gid:'default'}})); }

/* ===== 消息渲染 ===== */
function renderMsg(x,noScroll,isDM){
  const mine = isDM ? (x.senderId===me.uid||x.from===me.uid) : ((x.senderId||x.from)===me.uid);
  const w=document.createElement('div'); w.className='msg'+(mine?' mine':'');
  if(x.id) w.dataset.mid=x.id;
  const av=document.createElement('div'); av.className='av'; setAv(av,(x.sender||x.fromNick)||'?',(x.avatar||x.fromAvatar)||'');
  const bd=document.createElement('div'); bd.className='bd';
  const sn=document.createElement('div'); sn.className='sn'; sn.textContent=(x.sender||x.fromNick)||'';
  const bu=document.createElement('div'); bu.className='bubble';
  const isImg=(x.type==='image')||/^\/uploads\/.*\.(png|jpe?g|gif|webp)$/i.test(x.content||'');
  const isVid=(x.type==='video')||/^\/uploads\/.*\.(mp4|webm|mov)$/i.test(x.content||'');
  if(isImg) bu.innerHTML='<img src="'+esc(x.content)+'">';
  else if(isVid) bu.innerHTML='<video controls src="'+esc(x.content)+'"></video>';
  else bu.textContent=x.content||'';
  const rp=document.createElement('div'); rp.className='rep'; rp.textContent='举报'; rp.onclick=()=>openReport(x);
  bd.appendChild(sn);bd.appendChild(bu);bd.appendChild(rp);
  w.appendChild(av);w.appendChild(bd); $('msgs').appendChild(w);
}
function addSys(t){ const d=document.createElement('div'); d.className='sys-line'; d.textContent=t; $('msgs').appendChild(d); }
function toBottom(){ const m=$('msgs'); m.scrollTop=m.scrollHeight; }

/* ===== 发送 ===== */
function onInputKey(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendText(); } }
function sendText(){
  const i=$('msgInput'); const t=i.value.trim(); if(!t)return;
  sendContent(t,'text'); i.value=''; i.style.height='auto';
}
function sendContent(content,type){
  if(!ws||ws.readyState!==1){ alert('未连接服务器，发送失败，请稍后重试'); return; }
  if(current.type==='group'){ ws.send(JSON.stringify({type:'chat',data:{gid:'default',content,type}})); }
  else { ws.send(JSON.stringify({type:'dm',data:{toUid:current.id,content,type}})); }
  toBottom();
}
function pickImage(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f)return;
    if(f.size>8*1024*1024){alert('图片太大（限8MB）');return}
    const rd=new FileReader();
    rd.onload=async()=>{
      const up=await post('/api/upload',{data:rd.result,mime:f.type});
      if(up.ok) sendContent(up.url,'image'); else alert(up.msg||'上传失败');
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}

/* ===== 私聊历史 ===== */
async function loadDM(uid){
  $('msgs').innerHTML='';
  const r=await get('/api/dm/'+encodeURIComponent(uid)+'?me='+encodeURIComponent(me.uid));
  if(r.ok&&r.list) r.list.forEach(x=>renderMsg(Object.assign({},x,{senderId:x.from,sender:x.fromNick,avatar:x.fromAvatar}),true,true));
  toBottom();
}

/* ===== 添加好友 ===== */
function openAddFriend(){
  const uid=prompt('输入对方 12 位社区 ID：');
  if(!uid) return;
  if(!/^\d{12}$/.test(uid.trim())){ alert('ID 必须是 12 位数字'); return; }
  post('/api/friend',{uid:me.uid,friendUid:uid.trim()}).then(r=>{
    if(!r.ok){alert(r.msg||'添加失败');return}
    alert('已添加为好友'); loadFriends();
  });
}

/* ===== 举报 ===== */
let rMsg=null, rReason='';
const REASONS=['辱骂攻击','色情低俗','诈骗广告','刷屏骚扰','违法违规','其他'];
function openReport(x){
  rMsg=x; rReason='';
  $('reportTarget').textContent='举报对象：'+((x.sender||x.fromNick)||'该用户');
  const box=$('reasonList'); box.innerHTML='';
  REASONS.forEach(rz=>{
    const el=document.createElement('div'); el.className='reason'; el.textContent=rz;
    el.onclick=()=>{ rReason=rz; box.querySelectorAll('.reason').forEach(n=>n.classList.remove('on')); el.classList.add('on'); };
    box.appendChild(el);
  });
  $('reportText').value=''; $('reportMask').style.display='flex';
}
function closeReport(){ $('reportMask').style.display='none'; }
async function doReport(){
  if(!rMsg)return;
  if(!rReason){alert('请选择举报理由');return}
  const r=await post('/api/report',{
    deviceId:DEVICE_ID,
    reporterUid:me.uid, reporterNick:me.nick, token:me.token||'',
    targetUid:(rMsg.senderId||rMsg.from)||'',
    targetNick:(rMsg.sender||rMsg.fromNick)||'',
    reason:rReason, content:(rMsg.content||'').slice(0,500)
  });
  closeReport(); alert(r.ok?(r.msg||'举报已提交'):(r.msg||'提交失败'));
}

/* ===== 退出 ===== */
function logout(){
  if(!confirm('确定退出登录？'))return;
  localStorage.removeItem(LS_UID); localStorage.removeItem(LS_TOKEN);
  location.reload();
}

/* 输入框自动增高 */
const mi=$('msgInput');
mi.addEventListener('input',()=>{ mi.style.height='auto'; mi.style.height=Math.min(mi.scrollHeight,100)+'px'; });

checkAuth();
