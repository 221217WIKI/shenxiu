<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>神修尼亚 · 苹果安装</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="神修尼亚">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f1f2f4;min-height:100vh;color:#1a1a1a;padding:36px 20px 48px}
.logo{display:block;width:110px;height:110px;border-radius:22px;margin:0 auto;box-shadow:0 8px 26px rgba(0,0,0,.14)}
.t1{text-align:center;font-size:25px;font-weight:800;margin-top:18px}
.t2{text-align:center;font-size:11px;color:#9aa3b3;letter-spacing:9px;margin-top:6px}
.tip{text-align:center;font-size:12px;color:#8a94a6;margin-top:12px;line-height:1.7}
.card{background:#fff;border-radius:16px;padding:20px 18px;margin-top:26px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.card h3{font-size:15px;margin-bottom:14px;color:#0d2136}
.step{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.step:last-child{margin-bottom:0}
.num{width:26px;height:26px;border-radius:50%;background:#12b7f5;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step .txt{font-size:13.5px;line-height:1.65;color:#3a4350}
.step .txt b{color:#0d2136}
.share{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1px solid #d5dae3;border-radius:5px;vertical-align:middle;margin:0 2px}
.btn{display:block;text-align:center;text-decoration:none;background:linear-gradient(135deg,#12b7f5,#0487d8);color:#fff;font-size:15px;font-weight:700;padding:14px;border-radius:12px;margin-top:26px}
.warn{margin-top:18px;background:#fff8e6;border:1px solid #ffe2a8;border-radius:12px;padding:13px 15px;font-size:12.5px;color:#8a6d1f;line-height:1.7}
</style>
</head>
<body>
<img class="logo" src="apple-touch-icon.png" alt="神修尼亚">
<div class="t1">神修尼亚</div>
<div class="t2">神修帝国</div>
<div class="tip">苹果手机安装方式（无需 App Store）</div>

<div class="card">
  <h3>四步装到桌面</h3>
  <div class="step"><div class="num">1</div><div class="txt">一定要用 <b>Safari 浏览器</b> 打开这个链接（微信、QQ 里点开会装不上）</div></div>
  <div class="step"><div class="num">2</div><div class="txt">点屏幕底部中间的 <span class="share">⬆</span> <b>分享按钮</b></div></div>
  <div class="step"><div class="num">3</div><div class="txt">在弹出菜单里往下滑，选 <b>「添加到主屏幕」</b></div></div>
  <div class="step"><div class="num">4</div><div class="txt">点 <b>「添加」</b>，桌面就会出现带纹章图标的 <b>神修尼亚</b></div></div>
</div>

<a class="btn" href="qq.html">进入聊天</a>

</body>
</html>
